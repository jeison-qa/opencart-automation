serenity {
  take.screenshots = AFTER_EACH_STEP
  restart.browser.for.each = scenario

}

# Para ejecutar sin ventana: -Dheadless.mode=true
headless.mode = false
wait.for.timeout = 30000

webdriver {
  driver = chrome

}

chrome.switches = "--start-maximized;--window-size=1920,1080;--remote-allow-origins=*;--disable-notifications;--disable-infobars;--no-sandbox;--disable-dev-shm-usage;--ignore-certificate-errors"