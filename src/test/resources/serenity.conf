serenity {
  take.screenshots = AFTER_EACH_STEP
  restart.browser.for.each = scenario
  # step.delay = 0
}

# Para ejecutar sin ventana: -Dheadless.mode=true
headless.mode = true

webdriver {
  driver = chrome
  capabilities {
    browserName = "chrome"
    acceptInsecureCerts = true
    "goog:chromeOptions" {
      args = ["remote-allow-origins=*", "start-maximized",
              "no-sandbox", "disable-dev-shm-usage", "disable-infobars",
              "disable-notifications", "ignore-certificate-errors"]
    }
  }
}