name: E2E OpenCart (Serenity BDD)

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Dar permisos al wrapper
        run: chmod +x gradlew

      - name: Ejecutar pruebas (Chrome headless)
        run: ./gradlew clean test -Dheadless.mode=true

      - name: Publicar reporte de Serenity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serenity-report
          path: target/site/serenity